version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Must track the minimum supported VS Code (engines.vscode ^1.104.0); bump deliberately together with engines.
      - dependency-name: '@types/vscode'
      # Types must match the oldest supported Node runtime; bump deliberately.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
